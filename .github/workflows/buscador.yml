name: Buscar oportunidades inmobiliarias

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/buscador.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: buscador-telegram
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar buscador
        run: python src/buscador.py

      - name: Depurar resultados
        run: python src/postfilter.py

      - name: Enviar alertas por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_SCORE: "75"
          MAX_ALERT_RISK: "15"
          MAX_ALERTS_PER_RUN: "5"
        run: python src/notificar_telegram.py

      - name: Guardar resultados
        run: |
          git config user.name "buscador-inmobiliario[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.md
          if [ -f data/alerted_ids.json ]; then git add data/alerted_ids.json; fi
          if [ -f data/telegram_sent.enc ]; then git add data/telegram_sent.enc; fi
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar oportunidades inmobiliarias"
            git pull --rebase origin main
            git push
          fi
