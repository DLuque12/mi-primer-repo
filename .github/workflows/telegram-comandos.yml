name: Comandos Telegram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-comandos.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: buscador-telegram
  cancel-in-progress: false

jobs:
  comandos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar comandos de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python src/comandos_telegram.py

      - name: Guardar estado
        run: |
          git config user.name "buscador-inmobiliario[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/telegram_update_state.json ]; then git add data/telegram_update_state.json; fi
          if [ -f data/telegram_subscribers.enc ]; then git add data/telegram_subscribers.enc; fi
          if [ -f data/telegram_sent.enc ]; then git add data/telegram_sent.enc; fi
          if [ -f data/latest.json ]; then git add data/latest.json; fi
          if [ -f data/latest.md ]; then git add data/latest.md; fi
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar estado de comandos Telegram"
            git pull --rebase origin main
            git push
          fi
